<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Passwind</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <svg xmlns="http://www.w3.org/2000/svg" class="brand" viewBox="0 0 1254 1254" role="img" aria-label="Passwind logo">

  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#101827"/><stop offset="0.6" stop-color="#080d17"/><stop offset="1" stop-color="#04070d"/>
    </radialGradient>
    <linearGradient id="ringL" gradientUnits="userSpaceOnUse" x1="208" y1="125" x2="560" y2="1090">
      <stop offset="0" stop-color="#f4f6fb"/><stop offset="0.55" stop-color="#cfd5e3"/><stop offset="1" stop-color="#8e98ae"/>
    </linearGradient>
    <linearGradient id="ringR" gradientUnits="userSpaceOnUse" x1="1046" y1="125" x2="700" y2="1090">
      <stop offset="0" stop-color="#c7cedd"/><stop offset="0.55" stop-color="#8d97ab"/><stop offset="1" stop-color="#5f687c"/>
    </linearGradient>
    <linearGradient id="shackle" gradientUnits="userSpaceOnUse" x1="458" y1="290" x2="796" y2="520">
      <stop offset="0" stop-color="#eef1f7"/><stop offset="0.45" stop-color="#aab3c6"/><stop offset="1" stop-color="#6d778c"/>
    </linearGradient>
    <linearGradient id="bodyL" gradientUnits="userSpaceOnUse" x1="406" y1="523" x2="627" y2="833">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#d9dee9"/><stop offset="1" stop-color="#a3acbf"/>
    </linearGradient>
    <linearGradient id="bodyR" gradientUnits="userSpaceOnUse" x1="627" y1="523" x2="848" y2="833">
      <stop offset="0" stop-color="#c4cad8"/><stop offset="0.55" stop-color="#8f99ad"/><stop offset="1" stop-color="#697388"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5aa9ff" stop-opacity="0.9"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="627" height="1254"/></clipPath>
    <clipPath id="right"><rect x="627" y="0" width="627" height="1254"/></clipPath>
    <mask id="metal" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <path d="M627,125 L1046,290 L1046,572 C1046,806 880,992 627,1090 C374,992 208,806 208,572 L208,290 Z M627,195 L980,332 L980,560 C980,760 840,925 627,1020 C414,925 273,760 273,560 L273,332 Z" fill="#fff" fill-rule="evenodd"/>
      <rect x="406" y="523" width="442" height="310" rx="38" fill="#fff"/>
    </mask>
  </defs>
  <rect width="1254" height="1254" rx="270" fill="url(#bg)"/>

    <g class="shield">
      <path d="M627,125 L1046,290 L1046,572 C1046,806 880,992 627,1090 C374,992 208,806 208,572 L208,290 Z M627,195 L980,332 L980,560 C980,760 840,925 627,1020 C414,925 273,760 273,560 L273,332 Z" fill="url(#ringL)" fill-rule="evenodd" clip-path="url(#left)"/>
      <path d="M627,125 L1046,290 L1046,572 C1046,806 880,992 627,1090 C374,992 208,806 208,572 L208,290 Z M627,195 L980,332 L980,560 C980,760 840,925 627,1020 C414,925 273,760 273,560 L273,332 Z" fill="url(#ringR)" fill-rule="evenodd" clip-path="url(#right)"/>
      <path d="M627,125 L1046,290 L1046,572 C1046,806 880,992 627,1090 C374,992 208,806 208,572 L208,290 Z" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
      <path d="M627,195 L980,332 L980,560 C980,760 840,925 627,1020 C414,925 273,760 273,560 L273,332 Z" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2.5"/>
    </g>
  <g class="loop-lock">
      <g class="shackle">
        <path d="M485,520 V459 A142,142 0 0 1 769,459 V520" fill="none" stroke="url(#shackle)" stroke-width="54"/>
        <path d="M512,520 V459 A115,115 0 0 1 742,459 V520" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="4"/>
        <path d="M458,520 V459 A169,169 0 0 1 796,459 V520" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
        <path d="M520,520 V459 A107,107 0 0 1 734,459 V520" fill="none" stroke="#04070d" stroke-opacity="0.45" stroke-width="9"/>
      </g>
      <g class="body">
        <rect x="406" y="523" width="442" height="310" rx="38" fill="url(#bodyL)" clip-path="url(#left)"/>
        <rect x="406" y="523" width="442" height="310" rx="38" fill="url(#bodyR)" clip-path="url(#right)"/>
        <rect x="408" y="525" width="438" height="306" rx="36" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3"/>
        <circle class="keyglow" cx="627" cy="700" r="150" fill="url(#glow)" opacity="0"/>
        <g class="keyhole" fill="#070b13">
          <circle cx="627" cy="650" r="53"/>
          <path d="M606,688 H648 L674,778 H580 Z"/>
        </g>
      </g>
  </g>
  <g mask="url(#metal)"><g transform="skewX(-18)"><rect class="sheen-rect" x="-340" y="0" width="300" height="1254" fill="url(#sheen)" opacity="0"/></g></g>
</svg>
    <h1 data-i18n="appTitle"></h1>
    <select id="lang" class="lang" aria-label="Language">
      <option value="auto" data-i18n="langAuto"></option>
    </select>
  </header>

  <div class="cols">
    <!-- 1: generator -->
    <div class="col">
      <section class="card output">
        <div class="pwbox">
          <div id="pw" class="pw" aria-live="polite"></div>
          <button id="pwCopy" type="button" class="icon-btn pw-copy" data-i18n-title="copyTitle"></button>
          <span id="pwTip" class="tip" role="status"></span>
        </div>
        <div class="meter"><div id="bar"></div></div>
        <div id="strength" class="strength"></div>
        <div class="actions">
          <button id="regen" type="button" class="pill" data-i18n="regen" data-i18n-title="regenTitle"></button>
          <button id="copy" type="button" class="pill" data-i18n="copy" data-i18n-title="copyTitle"></button>
        </div>
        <div class="check">
          <button id="hibpBtn" type="button" class="mini" data-i18n="hibpCheck"></button>
          <span id="hibpResult" class="hibp"></span>
        </div>
      </section>

      <button id="insert" type="button" class="primary" data-i18n="insert"></button>
      <div id="status" class="status"></div>

      <a id="feedback" class="card navrow feedback" href="https://github.com/sturmjan/passwind/issues/new/choose" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
        <span class="st" data-i18n="feedback"></span>
      </a>



    </div>

    <!-- 3: accordion -->
    <div class="col right">
    <div class="acc" id="accBox">
      <details class="card" name="acc" open>
        <summary>
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="st" data-i18n="historyTitle"></span><span id="historyCount" class="badge"></span>
        </summary>
        <div class="body">
          <div class="hist-actions">
            <button id="historyToggle" type="button" class="mini"></button>
            <button id="historyClear" type="button" class="mini danger" data-i18n="historyClear"></button>
          </div>
          <div id="historyList" class="hist-list"></div>
        </div>
      </details>

      <details class="card" name="acc">
        <summary>
          <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
          <span class="st" data-i18n="autofillTitle"></span>
        </summary>
        <div class="body">
          <label class="row sel"><span data-i18n="offerMode"></span>
            <select id="offerMode">
              <option value="smart" data-i18n="offerSmart"></option>
              <option value="always" data-i18n="offerAlways"></option>
              <option value="icon" data-i18n="offerIcon"></option>
              <option value="off" data-i18n="offerOff"></option>
            </select>
          </label>
          <label class="row"><span data-i18n="fillConfirm"></span><input id="fillConfirm" type="checkbox"></label>
          <label class="row"><span data-i18n="autoCopy"></span><input id="autoCopy" type="checkbox"></label>
          <label class="row sel"><span data-i18n="clipClear"></span>
            <select id="clipboardClear">
              <option value="0" data-i18n="off"></option>
              <option value="30">30 s</option>
              <option value="60">1 min</option>
              <option value="120">2 min</option>
            </select>
          </label>
          <label class="row sel"><span data-i18n="historyMode"></span>
            <select id="historyMode">
              <option value="session" data-i18n="histSession"></option>
              <option value="local" data-i18n="histLocal"></option>
              <option value="off" data-i18n="histOff"></option>
            </select>
          </label>
        </div>
      </details>

      <details class="card" name="acc">
        <summary>
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></span>
          <span class="st" data-i18n="hibpTitle"></span>
        </summary>
        <div class="body">
          <div class="row sel">
            <input id="hibpInput" type="password" autocomplete="off" spellcheck="false" data-i18n-ph="hibpPlaceholder">
            <button id="hibpCustomBtn" type="button" class="mini wide" data-i18n="hibpCheck"></button>
            <span id="hibpCustomResult" class="hibp"></span>
            <span class="note" data-i18n="hibpNote"></span>
          </div>
        </div>
      </details>
      <button id="openSettings" type="button" class="navrow">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>
        <span class="st" data-i18n="settings"></span><span id="settingsSummary" class="badge"></span>
      </button>
    </div>

    <div id="settingsPanel" hidden>
      <div class="page-head">
        <button id="closeSettings" type="button" class="back"><span aria-hidden="true">&#8249;</span> <span data-i18n="back"></span></button>
        <h2 data-i18n="settings"></h2>
        <button id="reset" type="button" class="link head-link" data-i18n="reset"></button>
      </div>
      <section class="card list">
        <label class="row len">
          <span class="row-top"><span data-i18n="length"></span><b id="lenVal"></b></span>
          <input id="length" type="range" min="8" max="64" step="1">
        </label>
        <label class="row"><span data-i18n="upper"></span><input id="upper" type="checkbox"></label>
        <label class="row"><span data-i18n="lower"></span><input id="lower" type="checkbox"></label>
        <label class="row"><span data-i18n="digits"></span><input id="digits" type="checkbox"></label>
        <label class="row"><span data-i18n="symbols"></span><input id="symbols" type="checkbox"></label>
        <label class="row sym"><span data-i18n="symbolChars"></span><input id="symbolChars" type="text" maxlength="40" spellcheck="false"></label>
        <label class="row"><span data-i18n="ambiguous"></span><input id="excludeAmbiguous" type="checkbox"></label>
      </section>
      <label class="card reveal" style="margin-top:12px">
        <span class="rlabel"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span data-i18n="revealMode"></span></span>
        <select id="revealMode">
          <option value="off" data-i18n="revealOff"></option>
          <option value="hover" data-i18n="revealHover"></option>
          <option value="dblclick" data-i18n="revealDbl"></option>
          <option value="focus" data-i18n="revealFocus"></option>
          <option value="ctrl" data-i18n="revealCtrl"></option>
        </select>
      </label>
    </div>
    </div>
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/generator.js"></script>
  <script src="../src/hibp.js"></script>
  <script src="popup.js"></script>
</body>
</html>
