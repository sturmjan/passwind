name: Feature request / Nápad na funkci
description: What should it do? / Co by měl doplněk umět?
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea / Nápad
      description: Describe what you would like and why. / Popište, co chcete a proč.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround (optional) / Jak to řešíte dnes?
