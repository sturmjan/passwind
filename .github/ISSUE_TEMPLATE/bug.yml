name: Chyba / Bug report
description: Něco nefunguje / Something is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Děkuji za nahlášení. Prosím **nikdy nevkládejte skutečná hesla** ani jejich části. / Please **never paste real passwords**.
  - type: textarea
    id: what
    attributes:
      label: Co se stalo? / What happened?
      description: Jak chyba vypadá a co jste čekali? / What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Jak chybu vyvolat / Steps to reproduce
      placeholder: |
        1. Otevřít stránku ...
        2. Kliknout do pole pro heslo ...
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Web, kde se to stalo (volitelné) / Website (optional)
  - type: input
    id: version
    attributes:
      label: Verze doplňku a Chromu / Extension and Chrome version
      placeholder: "1.0.0 / Chrome 130"
