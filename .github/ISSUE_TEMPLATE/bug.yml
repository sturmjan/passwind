name: Bug report
description: Something is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **never paste real passwords** or parts of them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page ...
        2. Click the password field ...
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Website where it happened (optional)
  - type: input
    id: version
    attributes:
      label: Extension and Chrome version
      placeholder: "1.0.0 / Chrome 130"
