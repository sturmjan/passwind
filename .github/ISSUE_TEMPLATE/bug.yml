name: Bug report / Chyba
description: Something is not working / Něco nefunguje
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **never paste real passwords** or parts of them. / Prosím **nikdy nevkládejte skutečná hesla**. (Czech is welcome too / česky také.)
  - type: textarea
    id: what
    attributes:
      label: What happened? / Co se stalo?
      description: What did you expect instead? / Co jste čekali?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Jak chybu vyvolat
      placeholder: |
        1. Open the page ...
        2. Click the password field ...
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Website where it happened (optional) / Web (volitelné)
  - type: input
    id: version
    attributes:
      label: Extension and Chrome version / Verze doplňku a Chromu
      placeholder: "1.0.0 / Chrome 130"
