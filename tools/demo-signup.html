<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Ukázková registrace</title>
  <style>
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f4f5f7; color: #1d1d1f; }
    .wrap { max-width: 400px; margin: 70px auto 0; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 22px; color: #6b6b70; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 13px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cfd0d4; border-radius: 6px; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 6px; background: #1d1d1f; color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <form class="wrap" onsubmit="return false">
    <h1>Vytvořit účet</h1>
    <p>Ukázkový formulář pro testování doplňku.</p>
    <label for="mail">E-mail</label>
    <input id="mail" type="email" value="jan@example.com" autocomplete="off">
    <label for="pw1">Heslo</label>
    <input id="pw1" type="password" autocomplete="off">
    <label for="pw2">Heslo znovu</label>
    <input id="pw2" type="password" autocomplete="off">
    <button>Registrovat</button>
  </form>
</body>
</html>
