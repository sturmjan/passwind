<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Store graphics composer</title>
  <style>
    html, body { margin: 0; }
    body { font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
    .shot { width: 1280px; height: 800px; position: relative; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, #1d2a4a 0%, #0c1224 55%, #070b17 100%); color: #fff; }
    .shot h1 { margin: 0; padding-top: 44px; text-align: center; font-size: 46px; letter-spacing: -1px; font-weight: 700; }
    .shot p { margin: 8px 0 0; text-align: center; font-size: 22px; color: #a9b4cf; }
    .shot img { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); max-height: 600px; max-width: 1120px;
      border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
    .tile { width: 440px; height: 280px; display: flex; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 110% at 30% 0%, #1d2a4a 0%, #0c1224 60%, #070b17 100%); color: #fff; }
    .tile img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .tile b { display: block; font-size: 44px; letter-spacing: -1px; }
    .tile span { display: block; margin-top: 4px; font-size: 17px; color: #a9b4cf; max-width: 200px; line-height: 1.3; }
  </style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('mode') === 'tile') {
    document.body.innerHTML = '<div class="tile"><img src="../../docs/img/logo.svg" alt=""><div><b>Passwind</b><span>Strong passwords in one click</span></div></div>';
  } else {
    const d = document.createElement('div');
    d.className = 'shot';
    const h = document.createElement('h1'); h.textContent = q.get('title') || '';
    const p = document.createElement('p'); p.textContent = q.get('sub') || '';
    const i = document.createElement('img'); i.src = '../../docs/img/' + q.get('img');
    d.append(h, p, i);
    document.body.append(d);
  }
</script>
</body>
</html>
